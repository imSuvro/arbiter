name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic-version tag to publish, for example v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.version || github.ref_name }}

  images:
    name: publish-images
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable service images
        env:
          IMAGE_ROOT: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          docker buildx build --push -f docker/api.Dockerfile -t "$IMAGE_ROOT/api:$VERSION" .
          docker buildx build --push -f docker/web.Dockerfile -t "$IMAGE_ROOT/web:$VERSION" .
          docker buildx build --push -f docker/worker.Dockerfile -t "$IMAGE_ROOT/worker:$VERSION" .
          docker buildx build --push -f docker/sandbox.Dockerfile -t "$IMAGE_ROOT/sandbox:$VERSION" .

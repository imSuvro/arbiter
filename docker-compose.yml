services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - arbiter-mongo:/data/db
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.7
    profiles: ['integration']
    environment:
      SERVICES: sqs,s3
      DEBUG: 0
    ports:
      - '4566:4566'
    volumes:
      - arbiter-localstack:/var/lib/localstack

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      WEB_ORIGIN: http://localhost:3000
      # Compose keeps the embedded worker self-contained. Use `pnpm dev` with
      # SANDBOX_BACKEND=docker when testing the restricted Docker runner.
      SANDBOX_BACKEND: local
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      SANDBOX_BACKEND: local
    profiles: ['queue']
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  arbiter-mongo:
  arbiter-localstack:
